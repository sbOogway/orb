[project]
name = "ibkr-data"
version = "0.1.0"
description = "Fetch historical market data from Interactive Brokers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ib-insync>=0.9.86",
    "pandas>=3.0.3",
    "yfinance>=1.4.1",
]

[project.scripts]
fetch-candles = "ibkr_data.cli:main"
resample-daily = "ibkr_data.resample:main"
compare-yf = "ibkr_data.compare_yf:main"

[tool.uv]
package = true
