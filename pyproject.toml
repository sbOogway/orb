[project]
name = "ibkr-data"
version = "0.1.0"
description = "Fetch historical market data from Interactive Brokers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ib-insync>=0.9.86",
    "pandas>=3.0.3",
    "pandas-market-calendars>=4.5.1",
    "quantstats>=0.0.81",
    "ta>=0.11.0",
    "yfinance>=0.2.0",
]

[project.scripts]
fetch-candles = "ibkr_data.cli:main"
post-processing = "ibkr_data.post_processing:main"

[tool.uv]
package = true
